<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EasyApt</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tool shell — filter bar on top, results list + schematic map side by side, floor plan detail opens as a panel over the map */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --line:#d5dcd9;
  --fg:#17221f; --muted:#5c6b66; --accent:#0f6a73; --accent-ink:#ffffff; --accent-soft:#d8ecec;
  --ok:#2f7d4f; --ok-soft:#dcefe2; --warn:#a2650c; --warn-soft:#f6e9d2; --unk:#6b6f78; --unk-soft:#e6e7ea;
  --map-land:#eef1ec; --map-road:#ffffff; --map-hwy:#e9b872; --map-text:#7a8782;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211e; --sunk:#0d1311; --line:#2a3532;
  --fg:#e3ebe8; --muted:#94a39e; --accent:#4fb3bb; --accent-ink:#0c1514; --accent-soft:#163334;
  --ok:#6cc790; --ok-soft:#1a3326; --warn:#e2a849; --warn-soft:#3a2c14; --unk:#a5a9b2; --unk-soft:#272a30;
  --map-land:#141d1a; --map-road:#25302c; --map-hwy:#7a5a2c; --map-text:#7e8d88; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211e; --sunk:#0d1311; --line:#2a3532;
  --fg:#e3ebe8; --muted:#94a39e; --accent:#4fb3bb; --accent-ink:#0c1514; --accent-soft:#163334;
  --ok:#6cc790; --ok-soft:#1a3326; --warn:#e2a849; --warn-soft:#3a2c14; --unk:#a5a9b2; --unk-soft:#272a30;
  --map-land:#141d1a; --map-road:#25302c; --map-hwy:#7a5a2c; --map-text:#7e8d88; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1400px;margin:0 auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.demo{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:6px 10px}

.filters{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;padding:6px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
input[type=number]{width:110px}
button:focus-visible,input:focus-visible,select:focus-visible,.plan:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{margin-left:auto;font-family:var(--f-display);font-size:15px}
.count b{color:var(--accent);font-size:20px}

.main{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:12px;min-height:640px}
.list{display:flex;flex-direction:column;gap:10px;max-height:760px;overflow:auto;padding-right:4px}
.prop{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prop.hl{border-color:var(--accent)}
.prop-h{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.prop-h h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700}
.prop-h .addr{color:var(--muted);font-size:12px}
.pin-no{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:600}
.plan{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;background:transparent;width:100%;text-align:left;font:inherit;color:inherit;border-left:0;border-right:0;border-bottom:0}
.plan:hover{background:var(--sunk)}
.plan[aria-current="true"]{background:var(--accent-soft)}
.code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:5px;padding:3px 6px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan .meta{font-size:13px}
.plan .meta small{display:block;color:var(--muted);font-size:12px}
.avail{text-align:right;font-variant-numeric:tabular-nums}
.avail b{font-family:var(--f-display);font-size:18px;display:block;line-height:1}
.avail small{color:var(--muted);font-size:11px}
.tourdot{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-left:6px}
.empty{color:var(--muted);padding:24px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px}

.right{position:relative;background:var(--map-land);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
#map{position:absolute;inset:0;z-index:1}
.right{min-height:520px}
.mk{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:2px solid #fff;display:grid;place-items:center;font:600 12px var(--f-body);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk.sel{background:var(--warn)}
.mk.dim{width:12px;height:12px;background:var(--unk);opacity:.6}
.tour iframe{width:100%;height:100%;border:0;border-radius:10px}
.tour.has{padding:0;position:relative}
.tour .tour-bar{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.detail{z-index:500}

.detail{position:absolute;inset:0;background:var(--surface);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.d-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.d-top h2{margin:0;font-family:var(--f-display);font-size:22px;text-wrap:balance}
.d-top .addr{color:var(--muted);font-size:13px}
.close{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:6px 10px;cursor:pointer;font:inherit}
.d-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.tour{background:var(--sunk);border-radius:10px;aspect-ratio:16/10;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
.tour h4{margin:0;font-family:var(--f-display);font-size:16px}
.tour p{margin:0;color:var(--muted);font-size:12px;max-width:44ch}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:8px 14px;font:600 13px var(--f-body);cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tour-form{display:flex;gap:6px;width:100%;max-width:420px}
.tour-form input{flex:1;min-width:0}
.big{background:var(--accent-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.big .n{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;color:var(--accent)}
.big p{margin:0}
.specs{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.specs span{background:var(--surface);border-radius:5px;padding:3px 7px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);padding:7px 10px;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
td.u{font-family:var(--f-mono)}
tr.match td{background:var(--accent-soft)}
.chip{font-size:11px;border-radius:999px;padding:2px 8px;font-weight:600}
.chip.confirmed{background:var(--ok-soft);color:var(--ok)}
.chip.inferred{background:var(--warn-soft);color:var(--warn)}
.chip.unknown{background:var(--unk-soft);color:var(--unk)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);align-items:center}

.ask{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ask h4{margin:0;font-family:var(--f-display);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:4px 10px;font:12px var(--f-body);cursor:pointer}
.ask form{display:flex;gap:6px}
.ask form input{flex:1;min-width:0}
.convo{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.q{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:10px 10px 2px 10px;padding:6px 10px;max-width:85%}
.a{align-self:flex-start;background:var(--sunk);border-radius:10px 10px 10px 2px;padding:8px 10px;max-width:92%}
.a ul{margin:4px 0 0;padding-left:18px}

@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .right{min-height:420px;order:-1}
  .list{max-height:none}
  .detail{position:fixed;inset:0;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .d-grid{grid-template-columns:minmax(0,1fr)}
  .count{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>Easy<span>Apt</span></h1>
      <div class="sub">Kyle, TX · Every floor plan that fits, every available unit in it, and the tour for each layout.</div>
    </div>
    <div class="demo" id="updated">Loading live availability…</div>
  </header>

  <section class="filters" aria-label="Search criteria">
    <div class="f"><label>Bedrooms</label>
      <div class="seg" id="beds">
        <button data-v="any" aria-pressed="true">Any</button><button data-v="0" aria-pressed="false">Studio</button><button data-v="1" aria-pressed="false">1</button><button data-v="2" aria-pressed="false">2</button><button data-v="3" aria-pressed="false">3</button>
      </div></div>
    <div class="f"><label for="baths">Min baths</label>
      <select id="baths"><option value="0">Any</option><option value="1">1+</option><option value="1.5">1.5+</option><option value="2">2+</option></select></div>
    <div class="f"><label for="budget">Max rent ($/mo)</label><input id="budget" type="number" step="25" min="500" value="1600"></div>
    <div class="f"><label for="sqft">Min sq ft</label><input id="sqft" type="number" step="25" min="0" value="0"></div>
    <div class="f"><label for="movein">Move in by</label><input id="movein" type="date"></div>
    <div class="f"><label for="floorpref">Floor</label>
      <select id="floorpref"><option value="any">Any floor</option><option value="ground">Ground floor</option><option value="upper">Not ground floor</option><option value="top">Top floor</option></select></div>
    <div class="count" id="count" aria-live="polite"></div>
  </section>

  <div class="main">
    <div class="list" id="list"></div>
    <div class="right">
      <div id="map" aria-label="Map of matching communities in Kyle"></div>
      <div class="detail" id="detail" hidden></div>
    </div>
  </div>
</div>

<script>
/* ---------- Live data: Supabase "listings" view (one row per community, collected from Apartments.com) ---------- */
const SB_URL="https://huyaibxncjaizzousdqg.supabase.co", SB_KEY="sb_publishable_hkV5T81nVeb_DmItt_Aylw_lnXYgU1W";
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseAvail(t){
  if(!t||/now/i.test(t)) return new Date(TODAY);
  const iso=String(t).match(/^(\d{4})-(\d{2})-(\d{2})/); if(iso){const d=new Date(+iso[1],+iso[2]-1,+iso[3]);return d<TODAY?new Date(TODAY):d}
  const m=t.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2})/); if(!m) return new Date(TODAY);
  const mo=MON[m[1].toLowerCase()]; let y=TODAY.getFullYear();
  const d=new Date(y,mo,+m[2]); if(d<new Date(y,TODAY.getMonth()-1,1)) d.setFullYear(y+1);
  return d;
}
/* Floor from unit number: 3-digit -> 1st digit, 4-digit -> 2nd digit (building+floor+unit).
   Applied per community only if the result looks like a low-rise building (max floor <= 5). */
function rawFloor(unit){
  const n=(String(unit).split("-").pop().match(/^\d+$/)||[])[0]; if(!n) return null;
  if(n.length===3) return +n[0]; if(n.length===4) return +n[1]; return null;
}
const cleanName=n=>n.replace(/^\d+\./,"").trim();
function buildProps(rows){
  return rows.map((row,idx)=>{
    const d=row.data, id="p"+idx;
    const merged=new Map();
    for(const [name,beds,baths,sqft,rentLbl,units] of d.models){
      const nm=cleanName(name), k=nm+"|"+sqft;
      if(!merged.has(k)) merged.set(k,{code:nm,beds,baths,sqft,units:new Map()});
      for(const [u,price,av,fl] of units) if(u) merged.get(k).units.set(u,{unit:u,price,availText:av,listedFloor:Number.isFinite(fl)?fl:null});
    }
    let plans=[...merged.values()];
    const allUnits=plans.flatMap(p=>[...p.units.values()]);
    const listed=allUnits.map(u=>u.listedFloor).filter(f=>f!=null);
    const fl=allUnits.map(u=>rawFloor(u.unit)).filter(f=>f!=null);
    const trust=fl.length>0 && Math.max(...fl)<=5 && Math.min(...fl)>=1;
    const stories=listed.length?Math.max(...listed):(trust?Math.max(...fl):null);
    const tours=(d.tours||[]).filter(t=>t[0]);
    plans=plans.map(pl=>{
      const units=[...pl.units.values()].map(u=>{
        if(u.listedFloor!=null) return {unit:u.unit,price:u.price,avail:parseAvail(u.availText),floor:u.listedFloor,source:"confirmed"};
        const f=trust?rawFloor(u.unit):null;
        return {unit:u.unit,price:u.price,avail:parseAvail(u.availText),floor:f,source:f?"inferred":"unknown"}}).sort((a,b)=>(a.price||9e9)-(b.price||9e9));
      const token=pl.code.split(/[-\s]/)[0];
      let tour=tours.find(t=>t[1].split(/\s*-\s*/).some(x=>x.trim()===token||x.trim()===pl.code));
      if(!tour) tour=tours.find(t=>{const m=t[1].replace(/,/g,"").match(/(\d{3,4})\s*s\.?f/i);return m&&+m[1]===pl.sqft});
      return {...pl,units,tour:tour?`https://my.matterport.com/show/?m=${tour[0]}`:null,key:id+":"+pl.code+"|"+pl.sqft};
    }).filter(pl=>pl.units.length).sort((a,b)=>a.beds-b.beds||a.sqft-b.sqft);
    const addr=(d.addr||"").replace(/,?\s*Kyle,?\s*TX\s*\d*/i,"");
    return {id,name:d.name,addr,lat:d.lat,lng:d.lng,phone:d.phone,site:d.site,stories,plans,updated:new Date(row.scraped_at)};
  }).filter(p=>p.plans.length&&p.lat);
}
let PROPS=[];

/* ---------- Tour links (per floor plan, saved in this browser) ---------- */
let TOURS={};
try{TOURS=JSON.parse(localStorage.getItem("easyapt-tours")||"{}")}catch(e){TOURS={}}
function saveTours(){try{localStorage.setItem("easyapt-tours",JSON.stringify(TOURS))}catch(e){}}

/* ---------- State + filtering ---------- */
const S={beds:"any",baths:0,budget:1600,sqft:0,movein:"",floor:"any",sel:null,hlProp:null};
const $=id=>document.getElementById(id);
const fmt=n=>n?"$"+n.toLocaleString("en-US"):"Call";
const tourOf=pl=>pl.tour||TOURS[pl.key]||null;
const fdate=d=>d<=TODAY?"Now":d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const ord=n=>n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:Math.min(n%10,4)%4]||"th");
const bedLbl=b=>b===0?"Studio":b+" bd";

function unitMatches(u,p){
  if(u.price>S.budget) return false;
  if(S.movein && u.avail>new Date(S.movein+"T23:59")) return false;
  if(S.floor==="ground" && u.floor!==1 && u.source!=="unknown") return false;
  if(S.floor==="upper" && u.floor===1) return false;
  if(S.floor==="top" && u.floor!==p.stories && u.source!=="unknown") return false;
  return true;
}
function planMatches(pl){
  if(S.beds!=="any" && pl.beds!==+S.beds) return false;
  if(pl.baths<S.baths) return false;
  if(pl.sqft<S.sqft) return false;
  return true;
}
function results(){
  const out=[];
  for(const p of PROPS){
    const plans=[];
    for(const pl of p.plans){
      if(!planMatches(pl)) continue;
      const m=pl.units.filter(u=>unitMatches(u,p));
      if(m.length) plans.push({pl,m});
    }
    if(plans.length) out.push({p,plans});
  }
  return out;
}

/* ---------- Render list ---------- */
function render(){
  const res=results();
  const nu=res.reduce((a,r)=>a+r.plans.reduce((b,x)=>b+x.m.length,0),0);
  const np=res.reduce((a,r)=>a+r.plans.length,0);
  $("count").innerHTML=`<b>${nu}</b> units · ${np} floor plans · ${res.length} communities`;
  const L=$("list");
  if(!res.length){L.innerHTML=`<div class="empty">No units match. Raise the max rent or widen the bedroom filter.</div>`;drawMap(res);return}
  L.innerHTML=res.map((r,i)=>`
    <article class="prop${S.hlProp===r.p.id?" hl":""}" id="prop-${r.p.id}">
      <div class="prop-h" data-prop="${r.p.id}">
        <div><h3>${esc(r.p.name)}</h3><div class="addr">${esc(r.p.addr)}, Kyle TX</div></div>
        <div class="pin-no">${i+1}</div>
      </div>
      ${r.plans.map(({pl,m})=>`
        <button class="plan" data-key="${esc(pl.key)}" aria-current="${S.sel===pl.key}">
          <span class="code" title="${esc(pl.code)}">${esc(pl.code)}</span>
          <span class="meta">${bedLbl(pl.beds)} · ${pl.baths} ba · ${pl.sqft.toLocaleString()} sq ft${tourOf(pl)?'<span class="tourdot">3D tour</span>':""}
            <small>${m.some(u=>u.price)?"from "+fmt(Math.min(...m.filter(u=>u.price).map(u=>u.price)))+"/mo":"Call for pricing"}</small></span>
          <span class="avail"><b>${m.length}</b><small>available</small></span>
        </button>`).join("")}
    </article>`).join("");
  drawMap(res);
  if(S.sel) renderDetail();
}

/* ---------- Live map (Leaflet + OpenStreetMap) ---------- */
const MAP=L.map("map",{scrollWheelZoom:true}).setView([29.995,-97.858],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(MAP);
const PINS=L.layerGroup().addTo(MAP);
function drawMap(res){
  PINS.clearLayers();
  const shown=new Map(res.map((r,i)=>[r.p.id,i+1]));
  for(const p of PROPS){
    const n=shown.get(p.id), sel=S.sel&&S.sel.startsWith(p.id+":");
    const icon=L.divIcon({className:"",html:`<div class="mk${n?(sel?" sel":""):" dim"}">${n||""}</div>`,iconSize:n?[26,26]:[12,12],iconAnchor:n?[13,13]:[6,6]});
    const m=L.marker([p.lat,p.lng],{icon,title:p.name,keyboard:!!n}).addTo(PINS);
    m.bindTooltip(p.name+(n?"":" (no matches)"));
    if(n) m.on("click",()=>{S.hlProp=p.id;S.sel=null;$("detail").hidden=true;render();
      const el=$("prop-"+p.id);if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"})});
  }
}

/* ---------- Detail panel ---------- */
function findPlan(key){const [pid]=key.split(":");const p=PROPS.find(x=>x.id===pid);return {p,pl:p.plans.find(x=>x.key===key)}}
const chip=s=>`<span class="chip ${s}">${s==="confirmed"?"Confirmed":s==="inferred"?"Likely":"Not listed"}</span>`;
const floorTxt=u=>u.floor==null?"Unknown":ord(u.floor);

function renderDetail(){
  const {p,pl}=findPlan(S.sel); const D=$("detail");
  const m=pl.units.filter(u=>unitMatches(u,p));
  const tour=tourOf(pl), mine=!pl.tour&&!!TOURS[pl.key];
  D.hidden=false;
  D.innerHTML=`
    <div class="d-top">
      <div><h2>${esc(p.name)} · ${esc(pl.code)}</h2><div class="addr">${esc(p.addr)}, Kyle TX${p.phone?" · Leasing "+esc(p.phone):""}${p.site?` · <a href="${esc(p.site)}" target="_blank" rel="noopener">Property website</a>`:""}</div></div>
      <button class="close" id="close">Close</button>
    </div>
    <div class="d-grid">
      <div class="tour${tour?" has":""}">
        ${tour?`<iframe src="${tour}${tour.includes("?")?"&":"?"}play=1&qs=1" allow="fullscreen; xr-spatial-tracking" allowfullscreen title="3D tour of ${esc(pl.code)}"></iframe>
          <div class="tour-bar"><a class="btn" href="${tour}" target="_blank" rel="noopener">Full screen</a>${mine?'<button class="btn ghost" id="rmtour" style="background:var(--surface)">Remove</button>':""}</div>`
        :`<h4>No 3D tour listed for this layout</h4>
          <p>If you have this floor plan's Matterport link, paste it here. It's saved in this browser.</p>
          <form class="tour-form" id="tourform"><input id="tourin" type="url" placeholder="https://my.matterport.com/show/?m=" aria-label="Matterport link"><button class="btn" type="submit">Save</button></form>`}
      </div>
      <div class="big">
        <div class="n">${m.length}</div>
        <p><b>available ${m.length===1?"unit":"units"}</b> with this floor plan that fit your criteria${pl.units.length>m.length?` (${pl.units.length} total available)`:""}.</p>
        <div class="specs"><span>${bedLbl(pl.beds)}</span><span>${pl.baths} bath</span><span>${pl.sqft.toLocaleString()} sq ft</span>${p.stories?`<span>${p.stories}-story buildings${p.plans.some(x=>x.units.some(u=>u.source==="confirmed"))?"":" (est.)"}</span>`:""}</div>
      </div>
    </div>
    <div>
      <div class="legend" style="margin-bottom:6px">Floor: ${chip("confirmed")} from the property's building map ${chip("inferred")} read from unit number ${chip("unknown")} ask leasing office</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Unit</th><th>Floor</th><th>Accuracy</th><th>Rent</th><th>Available</th></tr></thead>
        <tbody>${pl.units.map(u=>`<tr class="${unitMatches(u,p)?"match":""}"><td class="u">${esc(u.unit)}</td><td>${floorTxt(u)}</td><td>${chip(u.source)}</td><td>${fmt(u.price)}</td><td>${fdate(u.avail)}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="legend" style="margin-top:6px">Highlighted rows fit your current criteria.</div>
    </div>
    <div class="ask">
      <h4>Ask about these units</h4>
      <div class="chips">
        <button data-q="Which floors are they on?">Which floors?</button>
        <button data-q="Any on the top floor?">Top floor?</button>
        <button data-q="Any on the ground floor?">Ground floor?</button>
        <button data-q="Which is cheapest?">Cheapest?</button>
        <button data-q="What can I move into soonest?">Soonest?</button>
      </div>
      <div class="convo" id="convo"></div>
      <form id="askform"><input id="askin" placeholder="e.g. anything on the 3rd floor by December?" aria-label="Question about units"><button class="btn" type="submit">Ask</button></form>
    </div>`;
  drawMap(results());
}

/* ---------- Unit Q&A (rule-based over the unit list) ---------- */
const MONTHS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function uline(u,p){
  const f=u.source==="confirmed"?`${ord(u.floor)} floor`:u.source==="inferred"?`likely ${ord(u.floor)} floor (from unit number)`:"floor not listed";
  return `<li>Unit ${esc(u.unit)}: ${f}, ${fmt(u.price)}, ${fdate(u.avail)==="Now"?"available now":"available "+fdate(u.avail)}</li>`;
}
function answer(q){
  const {p,pl}=findPlan(S.sel); let us=[...pl.units]; const t=q.toLowerCase(); const notes=[];
  if(!us.length) return "No units are currently listed for this floor plan.";
  const mi=MONTHS.findIndex(mo=>t.includes(mo));
  if(mi>=0){const yr=mi<TODAY.getMonth()?2027:2026;const end=new Date(yr,mi+1,0);us=us.filter(u=>u.avail<=end);notes.push(`available by end of ${end.toLocaleDateString("en-US",{month:"long"})}`)}
  const fm=t.match(/(\d+)(?:st|nd|rd|th)?\s*floor/);
  let want=null;
  if(/top/.test(t)){ if(!p.stories) return "This community's unit numbers don't show floors, so I can't tell which units are on the top floor. Ask the leasing office."; want=p.stories;} else if(/ground|first floor|1st floor|bottom/.test(t)) want=1; else if(fm) want=+fm[1];
  const unknown=us.filter(u=>u.source==="unknown");
  if(want!=null){
    const hit=us.filter(u=>u.floor===want);
    let s=hit.length?`${hit.length} on the ${ord(want)} floor${want===p.stories?" (top floor)":""}${notes.length?", "+notes.join(", "):""}:<ul>${hit.map(u=>uline(u,p)).join("")}</ul>`:`None confirmed or likely on the ${ord(want)} floor${notes.length?" "+notes.join(", "):""}.`;
    if(unknown.length) s+=`<p style="margin:6px 0 0">${unknown.length} unit${unknown.length>1?"s have":" has"} no floor listed (${unknown.map(u=>esc(u.unit)).join(", ")}). Confirm with the leasing office.</p>`;
    return s;
  }
  if(/cheap|lowest|least|budget/.test(t)){const u=us.sort((a,b)=>a.price-b.price)[0];return u?`Lowest rent${notes.length?" "+notes.join(""):""}:<ul>${uline(u,p)}</ul>`:"None in that window."}
  if(/soon|earliest|now|asap|move/.test(t)){const s=us.sort((a,b)=>a.avail-b.avail);const now=s.filter(u=>u.avail<=TODAY);return now.length?`${now.length} available now:<ul>${now.map(u=>uline(u,p)).join("")}</ul>`:`Earliest:<ul>${uline(s[0],p)}</ul>`}
  // default: floor breakdown
  const byF={};for(const u of us){const k=u.floor==null?"?":u.floor;(byF[k]=byF[k]||[]).push(u)}
  const keys=Object.keys(byF).sort();
  return `${us.length} unit${us.length>1?"s":""}${notes.length?" "+notes.join(""):""}, by floor:<ul>${us.sort((a,b)=>(a.floor??99)-(b.floor??99)).map(u=>uline(u,p)).join("")}</ul>`;
}
function ask(q){
  const c=$("convo");
  c.insertAdjacentHTML("beforeend",`<div class="q"></div><div class="a">${answer(q)}</div>`);
  c.querySelectorAll(".q")[c.querySelectorAll(".q").length-1].textContent=q;
  c.scrollTop=c.scrollHeight;
}

/* ---------- Events ---------- */
$("beds").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.beds=b.dataset.v;[...$("beds").children].forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("baths").addEventListener("change",e=>{S.baths=+e.target.value;render()});
$("budget").addEventListener("input",e=>{S.budget=+e.target.value||99999;render()});
$("sqft").addEventListener("input",e=>{S.sqft=+e.target.value||0;render()});
$("movein").addEventListener("change",e=>{S.movein=e.target.value;render()});
$("floorpref").addEventListener("change",e=>{S.floor=e.target.value;render()});
$("list").addEventListener("click",e=>{
  const pl=e.target.closest(".plan");
  if(pl){S.sel=pl.dataset.key;S.hlProp=null;render();return}
  const h=e.target.closest(".prop-h");
  if(h){S.hlProp=h.dataset.prop;render()}
});
$("detail").addEventListener("click",e=>{
  if(e.target.id==="close"){S.sel=null;$("detail").hidden=true;render();return}
  if(e.target.id==="rmtour"){delete TOURS[S.sel];saveTours();render();return}
  const c=e.target.closest("[data-q]");if(c)ask(c.dataset.q);
});
$("detail").addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="askform"){const v=$("askin").value.trim();if(v){ask(v);$("askin").value=""}}
  if(e.target.id==="tourform"){const v=$("tourin").value.trim();if(/^https:\/\/(my\.)?matterport\.com\//.test(v)){TOURS[S.sel]=v;saveTours();render()}else{$("tourin").setCustomValidity("Use a my.matterport.com link");$("tourin").reportValidity();setTimeout(()=>$("tourin").setCustomValidity(""),2000)}}
});
window.addEventListener("resize",()=>MAP.invalidateSize());

async function init(){
  try{
    const rows=await fetch(`${SB_URL}/rest/v1/listings?select=data,scraped_at`,{headers:{apikey:SB_KEY}}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
    PROPS=buildProps(rows);
    const nU=PROPS.reduce((a,p)=>a+p.plans.reduce((b,x)=>b+x.units.length,0),0);
    const last=new Date(Math.max(...PROPS.map(p=>p.updated)));
    $("updated").textContent=`Live: ${nU.toLocaleString()} available units across ${PROPS.length} communities · updated ${last.toLocaleDateString("en-US",{month:"short",day:"numeric"})}`;
    MAP.fitBounds(PROPS.map(p=>[p.lat,p.lng]),{padding:[30,30]});
  }catch(e){$("updated").textContent="Couldn't load listings right now. Refresh to try again.";}
  render();
  const rs=results(); const withTour=rs.flatMap(r=>r.plans).find(x=>tourOf(x.pl)); const pick=withTour||(rs[0]&&rs[0].plans[0]); if(pick){S.sel=pick.pl.key;render()}
}
init();
</script>
