<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EasyApt</title>
<link rel="icon" href="icon-app.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&display=swap">
<meta name="description" content="Search an area and see the exact apartments available right now: every floor plan, unit, floor, price, and 3D tour, read live from each property's own website.">
<style>
/* EasyApt results: a quiet listing sheet. White surfaces, near-black ink, black actions,
   one warm accent taken from the Lady Bird Lake sunset (apricot) used only for "matches you"
   and the selected pin. Layout: slim header + filter row, then list | full-height map. */
:root{
  --bg:#ffffff; --surface:#ffffff; --page:#f6f6f4; --sunk:#f1f1ee; --line:#e6e5e1; --line-strong:#d4d3ce;
  --fg:#17181b; --muted:#6c6d72; --faint:#9a9ba0;
  --accent:#17181b; --accent-ink:#ffffff; --accent-soft:#f1f1ee;
  --glow:#f2a978; --glow-soft:#fdf0e6; --glow-ink:#17181b;
  --mark:#f2a978; --mark-soft:#fdf0e6; --mark-ink:#17181b;
  --ok:#23895a; --ok-soft:#e5f4ec; --warn:#a2611a; --warn-soft:#fbefe1; --unk:#7c7d83; --unk-soft:#efeff0;
  --grid:transparent; --map-text:#6c6d72;
  --f-display:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --hdr:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121316; --surface:#17181c; --page:#1c1d21; --sunk:#202126; --line:#2a2b30; --line-strong:#3a3b41;
  --fg:#ededee; --muted:#a0a1a8; --faint:#76777e;
  --accent:#ededee; --accent-ink:#121316; --accent-soft:#24252a;
  --glow:#f2a978; --glow-soft:#3a2a20; --glow-ink:#17181b;
  --mark:#f2a978; --mark-soft:#3a2a20; --mark-ink:#17181b;
  --ok:#5fcf98; --ok-soft:#18301f; --warn:#e3a35c; --warn-soft:#352717; --unk:#9a9ba2; --unk-soft:#26272c;
  --map-text:#a0a1a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121316; --surface:#17181c; --page:#1c1d21; --sunk:#202126; --line:#2a2b30; --line-strong:#3a3b41;
  --fg:#ededee; --muted:#a0a1a8; --faint:#76777e;
  --accent:#ededee; --accent-ink:#121316; --accent-soft:#24252a;
  --glow:#f2a978; --glow-soft:#3a2a20; --glow-ink:#17181b;
  --mark:#f2a978; --mark-soft:#3a2a20; --mark-ink:#17181b;
  --ok:#5fcf98; --ok-soft:#18301f; --warn:#e3a35c; --warn-soft:#352717; --unk:#9a9ba2; --unk-soft:#26272c;
  --map-text:#a0a1a8; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,.plan:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* ---------- Results shell ---------- */
.app{height:100vh;height:100dvh;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));display:grid;grid-template-rows:auto minmax(0,1fr)}
header.top{height:var(--hdr);display:flex;align-items:center;gap:14px;padding-inline:20px;border-bottom:1px solid var(--line);min-width:0}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;flex:none}
h1 a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.crit{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 8px 7px 16px;font:500 14px var(--f-body);cursor:pointer;text-align:left}
.crit:hover{border-color:var(--line-strong)}
#searchsum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crit-edit{flex:none;font-weight:600;font-size:13px;background:var(--sunk);border-radius:999px;padding:3px 10px}
.demo{font-size:13px;color:var(--faint);white-space:nowrap;margin-left:auto}
.newsearch{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font:600 14px var(--f-body);cursor:pointer}
input,select{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;height:34px;padding:0 10px}

.main{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);min-height:0}
.list{overflow:auto;border-right:1px solid var(--line);min-height:0;overscroll-behavior:contain}
.list-head{padding:16px 20px 10px;font-size:14px;color:var(--muted)}
.list-head:empty{display:none}
.list-head b{color:var(--fg);font-weight:600}

/* community: one quiet row; tap to open its floor plans */
.c{border-top:1px solid var(--line)}
.c:first-child{border-top:0}
.c-row{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;align-items:center;gap:14px;width:100%;padding:15px 20px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.c-row:hover{background:var(--page)}
.c.hl > .c-row{background:var(--page)}
.c-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.c-name{font-size:16px;font-weight:600;letter-spacing:-.005em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-sub{font-size:13px;color:var(--muted)}
.c-price{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-price small{font-size:12px;font-weight:500;color:var(--muted)}
.chev{width:18px;height:18px;color:var(--faint);transition:transform .15s}
.c.open .chev{transform:rotate(180deg)}
.c-body{padding:0 0 12px}
.c-info{padding:0 20px 8px;font-size:13px;color:var(--muted)}
.c-links{display:flex;gap:16px;align-items:center;padding:8px 20px 0;font-size:13px;color:var(--muted)}
.c-links a{color:var(--fg);font-weight:600}

/* floor plan row inside an open community */
.plan{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;padding:10px 20px 10px 32px;cursor:pointer;background:transparent;text-align:left;font:inherit;color:inherit;border:0;box-shadow:inset 3px 0 0 transparent}
.plan:hover{background:var(--page)}
.plan[aria-current="true"]{background:var(--glow-soft);box-shadow:inset 3px 0 0 var(--glow)}
.plan .meta{font-size:14px;min-width:0}
.plan .meta b{font-weight:600}
.plan .meta small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.avail{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.avail b{font-weight:600}
.avail small{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:28px 20px;line-height:1.5}
.linkbtn{border:0;background:none;padding:0;color:var(--fg);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.fresh{font-size:12px;font-weight:600;white-space:nowrap}
.fresh.live{color:var(--ok)}
.fresh.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.fresh.saved{color:var(--faint)}
.checking{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--glow);margin-right:8px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* map: price pins on a quiet basemap */
.right{position:relative;min-width:0;min-height:0;background:var(--page)}
#map{position:absolute;inset:0;z-index:1}
.pm{border:1px solid rgba(23,24,27,.12);background:#fff;color:#17181b;border-radius:999px;padding:4px 9px;font:700 12.5px/1.2 var(--f-body);font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.18);cursor:pointer;white-space:nowrap;position:relative;margin-bottom:6px}
.pm::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:inherit;border-right:1px solid rgba(23,24,27,.12);border-bottom:1px solid rgba(23,24,27,.12);transform:translateX(-50%) rotate(45deg)}
.pm:hover{background:#17181b;color:#fff;z-index:2}
.pm.sel{background:var(--glow);color:#17181b;border-color:rgba(0,0,0,.15);z-index:3}
.pm-dot{width:9px;height:9px;border-radius:50%;background:#a3a4a9;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);pointer-events:auto}
.maplibregl-ctrl-attrib{font-size:11px}
.viewtoggle{display:none}

/* floor plan sheet over the map */
.detail{position:absolute;inset:0;z-index:500;background:var(--bg);overflow:auto;padding:0 32px 40px;display:flex;flex-direction:column;gap:22px}
.d-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:16px;align-items:flex-start;padding-top:24px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.d-top h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.d-top .addr{color:var(--muted);font-size:14px;margin-top:4px}
.d-top .addr a{color:var(--fg)}
.close{flex:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer;font:600 14px var(--f-body)}
.close:hover{border-color:var(--fg)}
.d-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:24px;align-items:start}
.tour{background:var(--page);border-radius:14px;aspect-ratio:16/10;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;overflow:hidden}
.tour.has{padding:0;position:relative}
.tour iframe{width:100%;height:100%;border:0}
.tour .fpimg{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:8px}
.tour:has(.fpimg){position:relative;padding:44px 12px 12px;background:#fff;border:1px solid var(--line)}
.tour:has(.fpimg) .tour-bar{left:12px;top:12px;bottom:auto;right:auto}
.tour .tour-bar{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.tour .tour-top{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
.tchip{border:0;background:rgba(23,24,27,.72);color:#fff;border-radius:999px;padding:5px 11px;font:600 12px var(--f-body);cursor:pointer;backdrop-filter:blur(6px)}
.tchip.on{background:#fff;color:#17181b}
.tour:has(.fpimg) .tchip.on{background:var(--page);color:var(--fg)}
.tour .tour-bar .btn{box-shadow:0 2px 10px rgba(0,0,0,.2)}
.tour h4{margin:0;font-size:16px;font-weight:650}
.tour p{margin:0;color:var(--muted);font-size:13px;max-width:44ch}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font:600 13px var(--f-body);cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line-strong)}
.tour-form{display:flex;gap:6px;width:100%;max-width:420px}
.tour-form input{flex:1;min-width:0}
.big{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.big .n{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}
.big p{margin:0;color:var(--muted);line-height:1.5}
.big p b{color:var(--fg);font-weight:600}
.specs{display:flex;flex-direction:column;font-size:14px;border-top:1px solid var(--line);margin-top:6px}
.specs span{padding:9px 0;border-bottom:1px solid var(--line)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px 12px;white-space:nowrap;border-bottom:1px solid var(--line-strong)}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.u{font-weight:650}
td a{color:var(--fg);font-weight:600}
tr.match td{background:var(--glow-soft)}
tr.match td.u{box-shadow:inset 3px 0 0 var(--glow)}
.chip{font-size:13px;font-weight:500}
.chip::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.chip.confirmed{color:var(--ok)} .chip.confirmed::before{background:var(--ok)}
.chip.inferred{color:var(--warn)} .chip.inferred::before{background:var(--warn)}
.chip.unknown{color:var(--unk)} .chip.unknown::before{background:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}

.ask{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:10px}
.ask h4{margin:0;font-size:16px;font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.ask form{display:flex;gap:6px}
.ask form input{flex:1;min-width:0;height:40px;border-radius:999px;padding:0 16px;font-size:16px}
.ask form .btn{height:40px}
.convo{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.q{align-self:flex-end;background:var(--fg);color:var(--bg);border-radius:14px 14px 4px 14px;padding:8px 12px;max-width:85%}
.a{align-self:flex-start;background:var(--page);border-radius:14px 14px 14px 4px;padding:10px 12px;max-width:92%}
.a ul{margin:4px 0 0;padding-left:18px}

/* communities without posted availability: tucked away at the bottom */
.others{border-top:1px solid var(--line);padding:0 20px 20px}
.others summary{cursor:pointer;padding:16px 0 6px;font-size:14px;color:var(--muted);font-weight:500}
.other{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:10px 0 6px}
.other b{font-weight:600;font-size:14px}
.other small{display:block;color:var(--muted);font-size:13px}
.other .btn{padding:6px 14px;font-size:13px;flex:none}

/* ---------- Home: step 1 (location) and step 2 (criteria) on the video ---------- */
.home{min-height:100%;display:flex;flex-direction:column}
.home-inner{width:100%;max-width:1120px;margin:0 auto;display:flex;flex-direction:column}
.home-bar{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:20px;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:10px}
.logo img,h1 a img{display:block;background:#fff;border-radius:6px}
.hero{display:flex;flex-direction:column}
.step{width:100%;max-width:720px}
.search{width:100%;background:#fff;color:#1c2421;border-radius:14px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.search .pin-ico{width:22px;height:22px;flex:none;color:#5b6661}
.search input{flex:1;min-width:0;height:auto;border:0;background:transparent;color:#1c2421;font-size:19px;padding:12px 0;color-scheme:light}
.search input::placeholder{color:#6b746f}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 18px 50px rgba(0,0,0,.35)}
.go{flex:none;border:0;background:#17181b;color:#fff;border-radius:10px;padding:0 30px;font:700 17px var(--f-body);cursor:pointer;min-height:54px}
.go:hover{filter:brightness(1.15)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-err{color:#ffd76a;font-size:15px;min-height:1.4em;margin-top:10px;text-shadow:0 1px 8px rgba(0,0,0,.4)}

.criteria{max-width:640px;background:rgba(255,255,255,.97);color:#17181b;color-scheme:light;border-radius:20px;padding:22px 26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35);backdrop-filter:blur(10px)}
.cr-back{border:0;background:none;color:#5d5f66;font:600 14px var(--f-body);padding:4px 0;cursor:pointer;display:inline-flex;gap:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-back:hover{color:#17181b}
.criteria h2{margin:6px 0 4px;font-size:clamp(22px,3.4vw,28px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.cr-hint{margin:0 0 18px;color:#6c6d72;font-size:14px}
.cr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.cr-f{display:flex;flex-direction:column;gap:7px;min-width:0}
.cr-f.wide{grid-column:1/-1}
.cr-l{font-size:13px;font-weight:600;color:#3d3e44}
.criteria input{height:44px;border-radius:10px;border:1px solid #d4d3ce;background:#fff;color:#17181b;font-size:16px;padding:0 12px;width:100%;min-width:0}
.criteria input:focus{outline:2px solid #17181b;outline-offset:-1px;border-color:transparent}
.range{display:flex;align-items:center;gap:8px}
.range span{color:#6c6d72;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{height:40px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid #d4d3ce;background:#fff;color:#17181b;font:500 15px var(--f-body);cursor:pointer}
.pills button:hover{border-color:#17181b}
.pills button[aria-pressed="true"]{background:#17181b;border-color:#17181b;color:#fff}
.cr-actions{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
.cr-actions .go{min-height:50px;border-radius:999px;padding:0 28px;font-size:16px}
.cr-status{font-size:13px;color:#6c6d72;display:inline-flex;align-items:center}

/* ---------- Home hero: Lady Bird Lake at dusk ---------- */
html{overflow-x:clip}
.hero-wrap{position:relative;isolation:isolate;width:100vw;margin-left:calc(50% - 50vw);min-height:100vh;min-height:100dvh;display:flex;color:#fff;background:#1b2140 url("hero.jpg") center/cover no-repeat}
.hero-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero-shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,14,32,.38) 0%,rgba(10,14,32,0) 22%,rgba(10,14,32,0) 70%,rgba(10,14,32,.25) 100%)}
.hero-wrap:has(#step2:not([hidden])) .hero-shade{background:rgba(10,14,32,.3)}
.hero-inner{gap:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.hero-wrap .home-bar .logo{color:#fff}
.hero-wrap .hero{flex:1;justify-content:center;align-items:center;padding:4vh 0 9vh}
@media (prefers-reduced-motion: reduce){.hero-video{display:none}}

/* ---------- Phones ---------- */
@media (max-width:760px){
  :root{--hdr:56px}
  .search{padding:6px 6px 6px 14px;border-radius:12px}
  .search input{font-size:17px;padding:10px 0}
  .go{padding:0 18px;min-height:48px;font-size:16px}
  .hero-wrap .hero{justify-content:flex-start;padding:10vh 0 0}
  .hero-wrap .hero:has(#step2:not([hidden])){padding-top:18px}
  .criteria{padding:18px 18px 20px;border-radius:18px}
  .cr-grid{grid-template-columns:minmax(0,1fr);gap:16px}
  .cr-actions .go{width:100%}
  .cr-status{width:100%;justify-content:center}

  header.top{gap:10px;padding-inline:12px}
  h1 a span,.demo{display:none}
  .crit{flex:1;padding:7px 6px 7px 12px;font-size:13px}
  .crit-edit{display:none}
  .newsearch{padding:8px 12px;font-size:13px}
  .main{grid-template-columns:minmax(0,1fr)}
  .list{border-right:0;padding-bottom:84px}
  .c-row{padding:15px 16px}
  .c-info,.c-links{padding-inline:16px}
  .plan{padding:11px 16px 11px 24px}
  .list-head{padding-inline:16px}
  /* list and map take turns; the map stays laid out so it is ready instantly */
  .right{position:fixed;left:0;right:0;top:var(--hdr);bottom:0;visibility:hidden;z-index:5}
  body[data-view="map"] .right{visibility:visible}
  body[data-view="map"] .list{display:none}

<script>
/* ---------- Live data: Supabase "listings" view (one row per community, collected from Apartments.com) ---------- */
const SB_URL="https://huyaibxncjaizzousdqg.supabase.co", SB_KEY="sb_publishable_hkV5T81nVeb_DmItt_Aylw_lnXYgU1W";
// Public anon key (safe to ship in a web page); used to call the live-check function.
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eWFpYnhuY2phaXp6b3VzZHFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTQ0OTIsImV4cCI6MjEwODY5MDQ5Mn0.OtomJwY7bxTVyh8UXkWPx3yKUKuNzPq1cEcLGbwNSSg";
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseAvail(t){
  if(!t||/now/i.test(t)) return new Date(TODAY);
  const iso=String(t).match(/^(\d{4})-(\d{2})-(\d{2})/); if(iso){const d=new Date(+iso[1],+iso[2]-1,+iso[3]);return d<TODAY?new Date(TODAY):d}
  const m=t.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2})/); if(!m) return new Date(TODAY);
  const mo=MON[m[1].toLowerCase()]; let y=TODAY.getFullYear();
  const d=new Date(y,mo,+m[2]); if(d<new Date(y,TODAY.getMonth()-1,1)) d.setFullYear(y+1);
  return d;
}
/* Floor from unit number: 3-digit -> 1st digit, 4-digit -> 2nd digit (building+floor+unit).
   Applied per community only if the result looks like a low-rise building (max floor <= 5). */
function rawFloor(unit){
  const n=(String(unit).split("-").pop().match(/^\d+$/)||[])[0]; if(!n) return null;
  if(n.length===3) return +n[0]; if(n.length===4) return +n[1]; return null;
}
const cleanName=n=>{let s=String(n);if(s.trim().startsWith("{")){try{s=JSON.parse(s).name||s}catch(e){}}return s.replace(/^\d+\./,"").trim()};
function buildProps(rows){
  return rows.map((row,idx)=>{
    const d=row.data, id="p"+idx;
    const merged=new Map();
    const isTour=x=>typeof x==="string"&&/^[A-Za-z0-9]{11}$/.test(x);
    for(const [name,beds,baths,sqft,slot4,units,img] of d.models){
      const nm=cleanName(name), k=nm+"|"+sqft;
      if(!merged.has(k)) merged.set(k,{code:nm,beds,baths,sqft,units:new Map(),planTour:null,img:""});
      const mp=merged.get(k);
      if(isTour(slot4)&&!mp.planTour) mp.planTour=slot4;
      if(img&&/^https:\/\//.test(img)&&!mp.img) mp.img=img;
      for(const [u,price,av,fl,ut] of units) if(u) mp.units.set(u,{unit:u,price,availText:av,listedFloor:Number.isFinite(fl)?fl:null,tour:isTour(ut)?ut:null});
    }
    let plans=[...merged.values()];
    const allUnits=plans.flatMap(p=>[...p.units.values()]);
    const listed=allUnits.map(u=>u.listedFloor).filter(f=>f!=null);
    const fl=allUnits.map(u=>rawFloor(u.unit)).filter(f=>f!=null);
    const trust=fl.length>0 && Math.max(...fl)<=5 && Math.min(...fl)>=1;
    const stories=listed.length?Math.max(...listed):(trust?Math.max(...fl):null);
    const tours=(d.tours||[]).filter(t=>t&&t[0]).map(t=>[tourUrl(t[0]),String(t[1]||"")]).filter(t=>t[0]);
    plans=plans.map(pl=>{
      const units=[...pl.units.values()].map(u=>{
        if(u.listedFloor!=null) return {unit:u.unit,price:u.price,avail:parseAvail(u.availText),floor:u.listedFloor,source:"confirmed",tour:u.tour};
        const f=trust?rawFloor(u.unit):null;
        return {unit:u.unit,price:u.price,avail:parseAvail(u.availText),floor:f,source:f?"inferred":"unknown",tour:u.tour}}).sort((a,b)=>(a.price||9e9)-(b.price||9e9));
      const token=pl.code.split(/[-\s]/)[0];
      const low=s=>s.trim().toLowerCase();
      let tour=tours.find(t=>t[1]&&(low(t[1])===low(pl.code)||t[1].split(/\s*-\s*/).some(x=>low(x)===low(token)||low(x)===low(pl.code))));
      if(!tour) tour=tours.find(t=>{const m=(t[1]||"").replace(/,/g,"").match(/(\d{3,4})\s*s\.?f/i);return m&&+m[1]===pl.sqft});
      const tid=pl.planTour?tourUrl(pl.planTour):(tour&&tour[0])||tourUrl((units.find(u=>u.tour)||{}).tour);
      return {...pl,units,tour:tid||null,key:id+":"+pl.code+"|"+pl.sqft};
    }).filter(pl=>pl.units.length).sort((a,b)=>a.beds-b.beds||a.sqft-b.sqft);
    const addr=(d.addr||"").replace(/,\s*(USA|United States)$/i,"");
    const used=new Set(plans.map(pl=>pl.tour).filter(Boolean));
    const communityTours=[...new Set(tours.filter(t=>!used.has(t[0])&&!t[1]).map(t=>t[0]))]; // tours labeled for a specific plan stay with that plan
    return {id,name:d.name,addr,lat:d.lat,lng:d.lng,phone:d.phone,site:d.site,stories,plans,communityTours,updated:new Date(row.scraped_at),live:!!row.live};
  }).filter(p=>p.plans.length&&p.lat);
}
let PROPS=[];

/* ---------- Tour links (per floor plan, saved in this browser) ---------- */
let TOURS={};
try{TOURS=JSON.parse(localStorage.getItem("easyapt-tours")||"{}")}catch(e){TOURS={}}
function saveTours(){try{localStorage.setItem("easyapt-tours",JSON.stringify(TOURS))}catch(e){}}

/* ---------- State + filtering ---------- */
const S={area:"",beds:"any",baths:0,minRent:0,budget:99999,sqft:0,movein:"",floor:"any",q:"",sel:null,hlProp:null,tourIdx:0};
const $=id=>document.getElementById(id);
const fmt=n=>n?"$"+n.toLocaleString("en-US"):"Call";
const tourOf=pl=>pl.tour||TOURS[pl.key]||null;
const low2=s=>String(s||"").trim().toLowerCase();
/* ---------- Virtual tours of any kind ---------- */
// Stored tours are full URLs; older entries are bare Matterport model ids.
function tourUrl(x){ if(!x) return null; x=String(x); if(/^[A-Za-z0-9]{11}$/.test(x)) return `https://my.matterport.com/show/?m=${x}`; return /^https:\/\//.test(x)?x:null; }
function tourInfo(url){
  let u; try{u=new URL(url)}catch(e){return null}
  const h=u.hostname.replace(/^www\./,"");
  if(h.endsWith("matterport.com")){const id=u.searchParams.get("m");return {kind:"3D tour",src:`https://my.matterport.com/show/?m=${id}&play=1&qs=1`,allow:"fullscreen; xr-spatial-tracking"}}
  if(/youtube(-nocookie)?\.com$/.test(h)||h==="youtu.be"){const id=u.searchParams.get("v")||u.pathname.split("/").pop();return {kind:"Video tour",src:`https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1`,allow:"autoplay; fullscreen; picture-in-picture"}}
  if(h.endsWith("vimeo.com")){const id=(u.pathname.match(/(\d{6,})/)||[])[1];return {kind:"Video tour",src:`https://player.vimeo.com/video/${id}`,allow:"autoplay; fullscreen; picture-in-picture"}}
  if(h.includes("wistia")){const id=(u.pathname.match(/(?:iframe|medias)\/([a-z0-9]+)/i)||[])[1];return {kind:"Video tour",src:id?`https://fast.wistia.net/embed/iframe/${id}`:url,allow:"autoplay; fullscreen"}}
  if(h.includes("realync")) return {kind:"Video tour",src:url,allow:"autoplay; fullscreen"};
  if(h.includes("kuula")||h.includes("iguide")||h.includes("cloudpano")||h.includes("panoskin")||h.includes("ricoh360")||h.includes("3dvista")||h.includes("giraffe360")||h.includes("zillow")) return {kind:"360° tour",src:url,allow:"fullscreen; xr-spatial-tracking; gyroscope; accelerometer"};
  return {kind:"Virtual tour",src:url,allow:"fullscreen; autoplay"};
}
const tourKind=url=>(tourInfo(url)||{}).kind||"Virtual tour";
const fdate=d=>d<=TODAY?"Now":d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const ord=n=>n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:Math.min(n%10,4)%4]||"th");
const bedLbl=b=>b===0?"Studio":b+" bd";

function unitMatches(u,p){
  if(u.price>S.budget) return false;
  if(S.minRent && u.price && u.price<S.minRent) return false;
  if(S.movein && u.avail>new Date(S.movein+"T23:59")) return false;
  if(S.floor==="ground" && u.floor!==1 && u.source!=="unknown") return false;
  if(S.floor==="upper" && u.floor===1) return false;
  if(S.floor==="top" && u.floor!==p.stories && u.source!=="unknown") return false;
  return true;
}
function planMatches(pl){
  if(S.beds!=="any" && (S.beds==="3" ? pl.beds<3 : pl.beds!==+S.beds)) return false;
  if(pl.baths<S.baths) return false;
  if(pl.sqft<S.sqft) return false;
  return true;
}
function results(){
  const out=[];
  for(const p of PROPS){
    const plans=[];
    const toks=S.q.toLowerCase().split(/\s+/).filter(Boolean);
    for(const pl of p.plans){
      if(!planMatches(pl)) continue;
      if(toks.length){const hay=(p.name+" "+p.addr+" "+pl.code).toLowerCase(); if(!toks.every(t=>hay.includes(t))) continue;}
      const m=pl.units.filter(u=>unitMatches(u,p));
      if(m.length) plans.push({pl,m});
    }
    if(plans.length) out.push({p,plans});
  }
  return out;
}

/* ---------- Results list: minimal, tap a name to see its floor plans ---------- */
const OPEN=new Set();
const priceFrom=units=>{const p=units.filter(u=>u.price).map(u=>u.price);return p.length?Math.min(...p):0};
function render(){
  const res=results();
  const nu=res.reduce((a,r)=>a+r.plans.reduce((b,x)=>b+x.m.length,0),0);
  $("count").innerHTML=res.length?`<b>${res.length} ${res.length===1?"apartment":"apartments"}</b> with ${nu.toLocaleString()} open ${nu===1?"unit":"units"}`:"";
  const L=$("list");
  const others=othersHtml();
  if(!res.length){
    const all=PROPS.flatMap(p=>p.plans.flatMap(pl=>pl.units.filter(u=>u.price).map(u=>({p,pl,u}))));
    const cheap=all.sort((a,b)=>a.u.price-b.u.price)[0];
    const msg=PROPS.length?`None of the ${PROPS.length} apartments with posted availability here match your criteria.${cheap?` The lowest rent right now is ${fmt(cheap.u.price)} at ${esc(cheap.p.name)}.`:""} <button class="linkbtn" data-edit>Change your criteria</button>`:"No posted availability matches yet.";
    L.innerHTML=`<div class="empty">${msg}</div>`+others;drawMap(res);return}
  L.innerHTML=res.map(r=>{
    const open=OPEN.has(r.p.id), units=r.plans.flatMap(x=>x.m), from=priceFrom(units);
    const beds=[...new Set(r.plans.map(x=>x.pl.beds))].sort((a,b)=>a-b).map(b=>b===0?"Studio":b+" bd");
    return `<article class="c${open?" open":""}${S.hlProp===r.p.id?" hl":""}" id="prop-${r.p.id}">
      <button class="c-row" data-prop="${r.p.id}" aria-expanded="${open}">
        <span class="c-main"><span class="c-name">${esc(r.p.name)}</span><span class="c-sub">${beds.join(", ")} &middot; ${units.length} open</span></span>
        <span class="c-price">${from?`<small>from</small> ${fmt(from)}`:"Call"}</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      ${open?`<div class="c-body">
        <div class="c-info">${esc(r.p.addr)}${r.p.live?' <span class="fresh live">Live</span>':` <span class="fresh saved">Saved ${r.p.updated.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>`}</div>
        ${r.plans.map(({pl,m})=>`<button class="plan" data-key="${esc(pl.key)}" aria-current="${S.sel===pl.key}">
          <span class="meta"><b>${esc(pl.code)}</b><small>${bedLbl(pl.beds)}, ${pl.baths} ba${pl.sqft?", "+pl.sqft.toLocaleString()+" sq ft":""}${tourOf(pl)?` &middot; ${tourKind(tourOf(pl))}`:""}</small></span>
          <span class="avail"><b>${priceFrom(m)?fmt(priceFrom(m)):"Call"}</b><small>${m.length} open</small></span>
        </button>`).join("")}
        <div class="c-links">${r.p.site?`<a href="${esc(r.p.site)}" target="_blank" rel="noopener">Website</a>`:""}${r.p.phone?`<span>${esc(r.p.phone)}</span>`:""}</div>
      </div>`:""}
    </article>`}).join("")+others;
  drawMap(res);
  if(S.sel) renderDetail();
}

/* ---------- Map: MapLibre + OpenFreeMap "positron" (quiet, labels kept light) with price pins ---------- */
let MAP=null, MAP_READY=false, MARKERS=[];
function initMap(){
  if(MAP||typeof maplibregl==="undefined") return;
  MAP=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/positron",center:[-97.86,30.0],zoom:10,attributionControl:{compact:true},cooperativeGestures:false});
  MAP.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
  MAP.on("load",()=>{MAP_READY=true;drawMap(results());fitAll()});
}
function fitAll(){
  if(!MAP) return;
  const pts=[...PROPS,...OTHERS].filter(p=>p.lat!=null).map(p=>[p.lng,p.lat]);
  if(!pts.length) return;
  const b=pts.reduce((bb,pt)=>bb.extend(pt),new maplibregl.LngLatBounds(pts[0],pts[0]));
  MAP.fitBounds(b,{padding:{top:50,bottom:50,left:50,right:50},maxZoom:14,duration:0});
}
function drawMap(res){
  if(!MAP) return;
  MARKERS.forEach(m=>m.remove()); MARKERS=[];
  const shown=new Map(res.map(r=>[r.p.id,r]));
  for(const o of OTHERS){ if(o.lat==null) continue;
    const el=document.createElement("div"); el.className="pm-dot"; el.title=o.name+" (availability not posted online)";
    MARKERS.push(new maplibregl.Marker({element:el}).setLngLat([o.lng,o.lat]).addTo(MAP));
  }
  for(const p of PROPS){
    const r=shown.get(p.id);
    const el=document.createElement("button");
    if(!r){ el.className="pm-dot"; el.title=p.name+" (no units match)"; el.tabIndex=-1; }
    else{
      const sel=(S.sel&&S.sel.startsWith(p.id+":"))||S.hlProp===p.id;
      el.className="pm"+(sel?" sel":""); el.type="button";
      const f=priceFrom(r.plans.flatMap(x=>x.m)); el.textContent=f?fmtShort(f):"Call";
      el.title=p.name; el.setAttribute("aria-label",`${p.name}, from ${f?fmt(f):"call for price"}`);
      el.addEventListener("click",ev=>{ev.stopPropagation();openCommunity(p.id,true)});
    }
    MARKERS.push(new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([p.lng,p.lat]).addTo(MAP));
  }
}
const fmtShort=n=>n>=10000?"$"+Math.round(n/1000)+"k":"$"+n.toLocaleString("en-US");
function openCommunity(id,fromMap){
  OPEN.add(id); S.hlProp=id; S.sel=null; $("detail").hidden=true;
  if(fromMap&&isPhone()) setView("list");
  render();
  const el=$("prop-"+id); if(el) el.scrollIntoView({block:fromMap?"start":"nearest",behavior:"smooth"});
  const p=PROPS.find(x=>x.id===id); if(p&&MAP&&!fromMap) MAP.easeTo({center:[p.lng,p.lat],zoom:Math.max(MAP.getZoom(),13)});
}

/* Complexes found in the area whose websites don't post unit availability we can read. */
let OTHERS=[];
function othersHtml(){
  if(!OTHERS.length) return "";
  const toks=S.q.toLowerCase().split(/\s+/).filter(Boolean);
  const list=OTHERS.filter(o=>!toks.length||toks.every(t=>(o.name+" "+(o.addr||"")).toLowerCase().includes(t)));
  if(!list.length) return "";
  return `<details class="others"><summary>${list.length} more nearby without online availability</summary>
    ${list.map(o=>`<div class="other"><div><b>${esc(o.name)}</b><small>${esc((o.addr||"").replace(/,\s*USA$/,""))}</small></div>${o.site?`<a class="btn ghost" href="${esc(o.site)}" target="_blank" rel="noopener">Website</a>`:""}</div>`).join("")}</details>`;
}

/* ---------- Detail panel ---------- */
function findPlan(key){const [pid]=key.split(":");const p=PROPS.find(x=>x.id===pid);return {p,pl:p.plans.find(x=>x.key===key)}}
const chip=s=>`<span class="chip ${s}">${s==="confirmed"?"Confirmed":s==="inferred"?"Likely":"Not listed"}</span>`;
const floorTxt=u=>u.floor==null?"Unknown":ord(u.floor);

function renderDetail(){
  const {p,pl}=findPlan(S.sel); const D=$("detail");
  const m=pl.units.filter(u=>unitMatches(u,p));
  const planTour=tourOf(pl), mine=!pl.tour&&!!TOURS[pl.key];
  const allTours=[...new Set([planTour,...(p.communityTours||[])].filter(Boolean))];
  if(S.tourFor!==S.sel){S.tourFor=S.sel;S.tourIdx=0}
  const tour=allTours[Math.min(S.tourIdx||0,allTours.length-1)]||null;
  const info=tour?tourInfo(tour):null;
  const isComm=tour&&tour!==planTour;
  D.hidden=false;
  D.innerHTML=`
    <div class="d-top">
      <div><h2>${esc(p.name)} · ${esc(pl.code)}</h2><div class="addr">${esc(p.addr)}${p.phone?" · Leasing "+esc(p.phone):""}${p.site?` · <a href="${esc(p.site)}" target="_blank" rel="noopener">Property website</a>`:""}</div></div>
      <button class="close" id="close" aria-label="Back to list"><span aria-hidden="true">&larr;</span> Back</button>
    </div>
    <div class="d-grid">
      <div class="tour${tour?" has":""}">
        ${tour&&info?`<iframe src="${esc(info.src)}" allow="${info.allow}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="${esc(info.kind)} of ${esc(pl.code)}"></iframe>
          <div class="tour-top">${allTours.length>1?allTours.map((t,i)=>`<button class="tchip${t===tour?" on":""}" data-tour="${i}">${t===planTour?esc(pl.code)+" "+tourKind(t).toLowerCase():tourKind(t)+(allTours.length>2?" "+(i+(planTour?0:1)):"")}</button>`).join(""):`<span class="tchip on">${isComm?"Community "+info.kind.toLowerCase():info.kind}</span>`}</div>
          <div class="tour-bar"><a class="btn" href="${esc(tour)}" target="_blank" rel="noopener">Open tour</a>${mine?'<button class="btn ghost" id="rmtour">Remove</button>':""}</div>`
        :pl.img?`<img class="fpimg" src="${esc(pl.img)}" alt="Floor plan ${esc(pl.code)}" loading="lazy"><div class="tour-bar"><span class="tchip on">Floor plan, no tour posted</span></div>`
        :`<h4>No 3D tour listed for this layout</h4>
          <p>If you have this floor plan's Matterport link, paste it here. It's saved in this browser.</p>
          <form class="tour-form" id="tourform"><input id="tourin" type="url" placeholder="https://my.matterport.com/show/?m=" aria-label="Matterport link"><button class="btn" type="submit">Save</button></form>`}
      </div>
      <div class="big">
        <div class="n">${m.length}</div>
        <p><b>${m.length===1?"unit is":"units are"} open</b> in this layout and fit your search${pl.units.length>m.length?`, out of ${pl.units.length} open in total`:""}.</p>
        <div class="specs"><span>${pl.beds===0?"Studio":pl.beds+" bedroom"+(pl.beds>1?"s":"")}</span><span>${pl.baths} bathroom${pl.baths>1?"s":""}</span><span>${pl.sqft?pl.sqft.toLocaleString()+" sq ft":"Size not listed"}</span>${p.stories?`<span>${p.stories}-story buildings${p.plans.some(x=>x.units.some(u=>u.source==="confirmed"))?"":" (estimated)"}</span>`:""}</div>
      </div>
    </div>
    <div>
      <div class="legend" style="margin-bottom:6px">Floor: ${chip("confirmed")} from the property's building map ${chip("inferred")} read from unit number ${chip("unknown")} ask leasing office</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Unit</th><th>Floor</th><th class="acc">Accuracy</th><th>Rent</th><th>Available</th><th>Tour</th></tr></thead>
        <tbody>${pl.units.map(u=>`<tr class="${unitMatches(u,p)?"match":""}"><td class="u">${esc(u.unit)}</td><td>${floorTxt(u)}</td><td class="acc">${chip(u.source)}</td><td>${fmt(u.price)}</td><td>${fdate(u.avail)}</td><td>${u.tour?`<a href="${esc(tourUrl(u.tour))}" target="_blank" rel="noopener">3D tour</a>`:"–"}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="legend" style="margin-top:6px">Highlighted units fit your search.</div>
    </div>
    <div class="ask">
      <h4>Ask about these units</h4>
      <div class="chips">
        <button data-q="Which floors are they on?">Which floors?</button>
        <button data-q="Any on the top floor?">Top floor?</button>
        <button data-q="Any on the ground floor?">Ground floor?</button>
        <button data-q="Which is cheapest?">Cheapest?</button>
        <button data-q="What can I move into soonest?">Soonest?</button>
      </div>
      <div class="convo" id="convo"></div>
      <form id="askform"><input id="askin" placeholder="e.g. anything on the 3rd floor by December?" aria-label="Question about units"><button class="btn" type="submit">Ask</button></form>
    </div>`;
}

/* ---------- Unit Q&A (rule-based over the unit list) ---------- */
const MONTHS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function uline(u,p){
  const f=u.source==="confirmed"?`${ord(u.floor)} floor`:u.source==="inferred"?`likely ${ord(u.floor)} floor (from unit number)`:"floor not listed";
  return `<li>Unit ${esc(u.unit)}: ${f}, ${fmt(u.price)}, ${fdate(u.avail)==="Now"?"available now":"available "+fdate(u.avail)}</li>`;
}
function answer(q){
  const {p,pl}=findPlan(S.sel); let us=[...pl.units]; const t=q.toLowerCase(); const notes=[];
  if(!us.length) return "No units are currently listed for this floor plan.";
  const mi=MONTHS.findIndex(mo=>t.includes(mo));
  if(mi>=0){const yr=mi<TODAY.getMonth()?2027:2026;const end=new Date(yr,mi+1,0);us=us.filter(u=>u.avail<=end);notes.push(`available by end of ${end.toLocaleDateString("en-US",{month:"long"})}`)}
  const fm=t.match(/(\d+)(?:st|nd|rd|th)?\s*floor/);
  let want=null;
  if(/top/.test(t)){ if(!p.stories) return "This community's unit numbers don't show floors, so I can't tell which units are on the top floor. Ask the leasing office."; want=p.stories;} else if(/ground|first floor|1st floor|bottom/.test(t)) want=1; else if(fm) want=+fm[1];
  const unknown=us.filter(u=>u.source==="unknown");
  if(want!=null){
    const hit=us.filter(u=>u.floor===want);
    let s=hit.length?`${hit.length} on the ${ord(want)} floor${want===p.stories?" (top floor)":""}${notes.length?", "+notes.join(", "):""}:<ul>${hit.map(u=>uline(u,p)).join("")}</ul>`:`None confirmed or likely on the ${ord(want)} floor${notes.length?" "+notes.join(", "):""}.`;
    if(unknown.length) s+=`<p style="margin:6px 0 0">${unknown.length} unit${unknown.length>1?"s have":" has"} no floor listed (${unknown.map(u=>esc(u.unit)).join(", ")}). Confirm with the leasing office.</p>`;
    return s;
  }
  if(/cheap|lowest|least|budget/.test(t)){const u=us.sort((a,b)=>a.price-b.price)[0];return u?`Lowest rent${notes.length?" "+notes.join(""):""}:<ul>${uline(u,p)}</ul>`:"None in that window."}
  if(/soon|earliest|now|asap|move/.test(t)){const s=us.sort((a,b)=>a.avail-b.avail);const now=s.filter(u=>u.avail<=TODAY);return now.length?`${now.length} available now:<ul>${now.map(u=>uline(u,p)).join("")}</ul>`:`Earliest:<ul>${uline(s[0],p)}</ul>`}
  // default: floor breakdown
  const byF={};for(const u of us){const k=u.floor==null?"?":u.floor;(byF[k]=byF[k]||[]).push(u)}
  const keys=Object.keys(byF).sort();
  return `${us.length} unit${us.length>1?"s":""}${notes.length?" "+notes.join(""):""}, by floor:<ul>${us.sort((a,b)=>(a.floor??99)-(b.floor??99)).map(u=>uline(u,p)).join("")}</ul>`;
}
function ask(q){
  const c=$("convo");
  c.insertAdjacentHTML("beforeend",`<div class="q"></div><div class="a">${answer(q)}</div>`);
  c.querySelectorAll(".q")[c.querySelectorAll(".q").length-1].textContent=q;
  c.scrollTop=c.scrollHeight;
}

/* ---------- Events ---------- */
$("list").addEventListener("click",e=>{
  if(e.target.closest("[data-edit]")){showCriteria();return}
  const pl=e.target.closest(".plan");
  if(pl){S.sel=pl.dataset.key;render();if(isPhone())$("detail").scrollTop=0;return}
  const row=e.target.closest(".c-row");
  if(row){const id=row.dataset.prop; if(OPEN.has(id)){OPEN.delete(id);if(S.hlProp===id)S.hlProp=null;render()} else openCommunity(id,false)}
});
$("detail").addEventListener("click",e=>{
  if(e.target.closest("#close")){S.sel=null;$("detail").hidden=true;render();return}
  if(e.target.id==="rmtour"){delete TOURS[S.sel];saveTours();render();return}
  const tb=e.target.closest("[data-tour]");if(tb){S.tourIdx=+tb.dataset.tour;renderDetail();return}
  const c=e.target.closest("[data-q]");if(c)ask(c.dataset.q);
});
$("detail").addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="askform"){const v=$("askin").value.trim();if(v){ask(v);$("askin").value=""}}
  if(e.target.id==="tourform"){const v=$("tourin").value.trim();if(/^https:\/\//.test(v)&&tourInfo(v)){TOURS[S.sel]=v;saveTours();render()}else{$("tourin").setCustomValidity("Paste a full https:// link to the tour");$("tourin").reportValidity();setTimeout(()=>$("tourin").setCustomValidity(""),2000)}}
});
window.addEventListener("resize",()=>{if(MAP)MAP.resize()});

/* phone: list and map take turns */
const isPhone=()=>matchMedia("(max-width: 760px)").matches;
function setView(v){ document.body.dataset.view=v; $("viewtoggle").textContent=v==="map"?"List":"Map"; if(v==="map"&&MAP) setTimeout(()=>MAP.resize(),0); }
$("viewtoggle").addEventListener("click",()=>setView(document.body.dataset.view==="map"?"list":"map"));

/* ---------- Search flow: location -> criteria (on the video) -> results ---------- */
function fmtTime(d){return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}
let PENDING=null, PENDING_AREA="", READY_AREA="";
function startSearch(area){
  if(PENDING&&PENDING_AREA===area) return PENDING;
  PENDING_AREA=area;
  PENDING=fetch(`${SB_URL}/functions/v1/search`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${SB_ANON}`,apikey:SB_ANON},body:JSON.stringify({area})})
    .then(r=>r.json()).then(res=>{ if(res.error) throw new Error(res.error); return res; });
  PENDING.then(()=>{ if(PENDING_AREA===area) $("cr-status").textContent="Ready"; },()=>{});
  return PENDING;
}
function applyResults(res){
  const comms=res.communities||[];
  OTHERS=comms.filter(c=>!(c.models&&c.models.length)&&c.site&&c.lat!=null).sort((a,b)=>a.name.localeCompare(b.name));
  PROPS=buildProps(comms.filter(c=>c.models&&c.models.length&&c.lat!=null).map(c=>({data:c,scraped_at:c.fetched_at,live:c.status==="live"})));
  const nLive=PROPS.filter(p=>p.live).length;
  $("updated").textContent=comms.length?`${nLive} of ${comms.length} checked live at ${fmtTime(new Date())}`:"";
  READY_AREA=PENDING_AREA;
}
function critSummary(){
  const bits=[S.area];
  if(S.beds!=="any") bits.push(S.beds==="0"?"Studio":S.beds==="3"?"3+ bd":S.beds+" bd");
  if(S.baths) bits.push(S.baths+"+ ba");
  if(S.minRent&&S.budget<99999) bits.push(`${fmt(S.minRent)} to ${fmt(S.budget)}`); else if(S.budget<99999) bits.push("under "+fmt(S.budget)); else if(S.minRent) bits.push("over "+fmt(S.minRent));
  if(S.movein) bits.push("by "+new Date(S.movein+"T12:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}));
  if(S.sqft) bits.push(S.sqft+"+ sq ft");
  if(S.floor!=="any") bits.push(S.floor==="ground"?"ground floor":S.floor==="upper"?"upper floor":"top floor");
  if(S.q) bits.push(`"${S.q}"`);
  return bits.join(", ");
}
function setPills(name,val){ document.querySelectorAll(`.pills[data-name="${name}"] button`).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===String(val)))); }
function fillCriteria(){
  $("cr-area").textContent=S.area;
  setPills("beds",S.beds); setPills("baths",S.baths); setPills("floor",S.floor);
  $("c-min").value=S.minRent||""; $("c-max").value=S.budget<99999?S.budget:""; $("c-move").value=S.movein; $("c-sqft").value=S.sqft||""; $("c-q").value=S.q;
}
function showStep(n){
  $("app").hidden=true; $("home").hidden=false;
  $("step1").hidden=n!==1; $("step2").hidden=n!==2;
  if(n===1) $("h-area").focus();
}
function showHome(){ showStep(1); try{history.replaceState(null,"",location.pathname+location.search)}catch(e){} }
function showCriteria(){ fillCriteria(); if(READY_AREA===S.area) $("cr-status").textContent=""; showStep(2); }
document.querySelectorAll(".pills").forEach(g=>g.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  const name=g.dataset.name, v=b.dataset.v; S[name]=name==="baths"?+v:v; setPills(name,S[name]);}));
$("homeform").addEventListener("submit",e=>{
  e.preventDefault();
  const area=$("h-area").value.trim();
  if(area.length<2){ $("homeerr").textContent="Type a city, neighborhood, or ZIP code."; $("h-area").focus(); return; }
  $("homeerr").textContent="";
  Object.assign(S,{area,beds:"any",baths:0,minRent:0,budget:99999,sqft:0,movein:"",floor:"any",q:"",sel:null,hlProp:null});
  OPEN.clear();
  $("cr-status").innerHTML='<span class="checking"></span>Checking apartment websites in the background';
  startSearch(area).catch(()=>{});
  fillCriteria(); showStep(2);
});
$("backto1").addEventListener("click",()=>{ $("h-area").value=S.area; showStep(1); });
$("step2").addEventListener("submit",async e=>{
  e.preventDefault();
  S.minRent=+$("c-min").value||0; S.budget=+$("c-max").value||99999; S.movein=$("c-move").value; S.sqft=+$("c-sqft").value||0; S.q=$("c-q").value.trim();
  if(S.minRent&&S.budget<99999&&S.minRent>S.budget){ [S.minRent,S.budget]=[S.budget,S.minRent]; }
  S.sel=null; $("detail").hidden=true;
  $("searchsum").textContent=critSummary();
  $("home").hidden=true; $("app").hidden=false; setView("list");
  try{history.pushState({r:1},"","#results")}catch(err){}
  window.scrollTo(0,0); try{initMap()}catch(err){console.warn("map",err)}
  if(READY_AREA!==S.area){
    $("list").innerHTML='<div class="empty"><span class="checking"></span>Checking apartment websites. A first search in a new area can take up to a minute.</div>';
    $("count").textContent=""; $("updated").textContent="";
    try{ applyResults(await startSearch(S.area)); }
    catch(err){ PROPS=[];OTHERS=[]; $("list").innerHTML=`<div class="empty">The search didn't finish (${esc(err.message||"network error")}). <button class="linkbtn" id="retry">Try again</button></div>`; $("retry")&&$("retry").addEventListener("click",()=>{PENDING=null;$("step2").requestSubmit()}); return; }
  }
  render();
  if(MAP_READY) fitAll();
});
$("editcrit").addEventListener("click",showCriteria);
$("newsearch").addEventListener("click",showHome);
$("logohome").addEventListener("click",e=>{e.preventDefault();showHome()});
window.addEventListener("popstate",()=>{ if(!$("app").hidden) showCriteria(); });

/* Hero video: only plays on the home screen; skipped for data-saver and reduced motion. */
(function(){const v=$("herovideo");if(!v)return;
  const save=navigator.connection&&navigator.connection.saveData;
  const calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(save||calm){v.removeAttribute("autoplay");v.pause();v.preload="none";return;}
  const sync=()=>{ if($("home").hidden) v.pause(); else v.play().catch(()=>{}); };
  new MutationObserver(sync).observe($("home"),{attributes:true,attributeFilter:["hidden"]});
})();

</script>
